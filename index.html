<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRCB 출퇴근 관리 System</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #2c3e50; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { font-size: 14px; color: #555; font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
    .btn-in { background-color: #28a745; }
    .btn-out { background-color: #dc3545; }
    #result { margin-top: 20px; padding: 10px; border-radius: 6px; display: none; font-size: 14px; }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="card">
  <h2>⏰ 출퇴근 관리 시스템</h2>
  
  <div class="form-group">
    <label for="name">이름</label>
    <input type="text" id="name" placeholder="성함을 입력하세요" autocomplete="off" value="">
  </div>

  <div class="form-group">
    <label for="note">비고 (선택사항)</label>
    <textarea id="note" rows="2" placeholder="외근, 조퇴 등의 사유 입력"></textarea>
  </div>

  <div class="btn-group">
    <button class="btn-in" onclick="submitAttendance('checkIn')">출근하기</button>
    <button class="btn-out" onclick="submitAttendance('checkOut')">퇴근하기</button>
  </div>

  <div id="result"></div>
</div>

<script>
  // 📌 적용해주신 앱스 스크립트 웹앱 주소
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwnTe9_i7f8IGB0YuPw-7kRerFvbi5WwNVC4RoLB35DiDYg2wJWSGJWYVJkhcVhhfS2/exec";

  let userIp = "-";
  fetch('https://api.ipify.org?format=json')
    .then(res => res.json())
    .then(data => userIp = data.ip)
    .catch(() => userIp = "IP 확인 불가");

  function submitAttendance(action) {
    const nameEl = document.getElementById('name');
    const noteEl = document.getElementById('note');
    const resultDiv = document.getElementById('result');

    const name = nameEl.value.trim();
    const note = noteEl.value.trim();

    if (!name) {
      alert("이름을 입력해 주세요.");
      return;
    }

    const payload = {
      action: action,
      name: name,
      note: note,
      ip: userIp,
      device: navigator.userAgent.includes('Mobile') ? '모바일' : 'PC'
    };

    resultDiv.style.display = "block";
    resultDiv.className = "";
    resultDiv.innerText = "처리 중입니다...";

    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      resultDiv.className = "success";
      resultDiv.innerText = (action === 'checkIn' ? '출근' : '퇴근') + " 요청이 전송되었습니다. 스프레드시트를 확인해 보세요.";
      
      // 입력창 초기화
      nameEl.value = "";
      noteEl.value = "";
    })
    .catch(err => {
      resultDiv.className = "error";
      resultDiv.innerText = "전송 실패: " + err.message;
    });
  }
</script>

</body>
</html>
