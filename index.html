<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 통합 출퇴근 및 근태 관리 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
      color: #495057;
    }
    input[type="text"], input[type="email"], textarea, input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea { resize: vertical; }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn-in { background-color: #28a745; }
    .btn-in:hover { background-color: #218838; }
    .btn-in:disabled { background-color: #6c757d; cursor: not-allowed; opacity: 0.6; }
    .btn-out { background-color: #dc3545; }
    .btn-out:hover { background-color: #c82333; }
    .btn-outstation {
      width: 100%;
      background-color: #6c757d;
      margin-top: 12px;
    }
    .btn-outstation:hover { background-color: #5a6268; }

    /* 알림 & 모달 팝업 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: center;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-modal-cancel { background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-modal-submit { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .toast-msg { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    .timer-sec { font-size: 13px; color: #777; }
  </style>
</head>
<body>

<div class="container">
  <h2>🏢 출퇴근 기록 관리</h2>

  <div class="form-group">
    <label for="userName">성함</label>
    <input type="text" id="userName" placeholder="성함을 입력하세요 (예: 홍길동)">
  </div>

  <div class="form-group">
    <label for="notes">비고 (특이사항 - 클릭 시 창 자동닫힘 멈춤)</label>
    <textarea id="notes" rows="2" placeholder="사유 기재 시 창이 닫히지 않고 유지됩니다." onclick="pauseAutoClose()" onfocus="pauseAutoClose()"></textarea>
  </div>

  <div class="btn-group">
    <button id="btnCheckIn" class="btn btn-in" onclick="sendAttendance('checkIn')">☀️ 출근 등록</button>
    <button id="btnCheckOut" class="btn btn-out" onclick="sendAttendance('checkOut')">🌙 퇴근 등록 (재등록 가능)</button>
  </div>

  <button class="btn btn-outstation" onclick="pauseAutoClose(); openOutstationModal();">📝 사외근무 / 직퇴 사전 신청</button>
</div>

<!-- 안내 및 카운트다운 팝업 -->
<div id="noticeModal" class="modal-overlay">
  <div class="modal-content">
    <div id="toastTitle" class="toast-msg"></div>
    <div class="timer-sec"><span id="countdown">3</span>초 후 창이 자동으로 닫힙니다.</div>
  </div>
</div>

<!-- 사외근무 사전 신청 모달 팝업 -->
<div id="outstationModal" class="modal-overlay">
  <div class="modal-content" style="text-align: left;">
    <h3 style="margin-top:0; color:#2c3e50;">사외근무(직퇴) 사전 신청</h3>
    <div class="form-group">
      <label for="reqName">성함</label>
      <input type="text" id="reqName" placeholder="성함 입력">
    </div>
    <div class="form-group">
      <label for="reqEmail">결과 수신 이메일</label>
      <input type="email" id="reqEmail" placeholder="결과를 안내받을 이메일 주소">
    </div>
    <div class="form-group">
      <label for="reqDate">외근 예정 일자</label>
      <input type="date" id="reqDate">
    </div>
    <div class="form-group">
      <label for="reqReason">사유 및 미팅 장소</label>
      <textarea id="reqReason" rows="3" placeholder="예: OO기업 외부 미팅 후 현지 퇴근"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeOutstationModal()">취소</button>
      <button id="btnSubmitOutstation" class="btn-modal-submit" onclick="submitOutstationRequest()">신청 제출</button>
    </div>
  </div>
</div>

<script>
  // ⚠️ 본인의 최신 구글 웹앱 URL을 입력하세요.
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwcSTmTbdTmI-zxjqQuLPRytRm3Qbt4QS4ymGRCMmEx1P3LLtwpvzdJm_KwujwNZdft/exec";

  let userIp = "-";
  let autoCloseTimer = null;
  let countdownInterval = null;

  async function fetchIp() {
    try {
      const res = await fetch("https://api.ipify.org?format=json");
      const data = await res.json();
      userIp = data.ip || "-";
    } catch (e) {
      userIp = "IP 수집 불가";
    }
  }
  fetchIp();

  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let os = "Desktop";
    if (/windows/i.test(ua)) os = "Desktop (Windows)";
    else if (/macintosh|mac os x/i.test(ua)) os = "Desktop (Mac)";
    else if (/android/i.test(ua)) os = "Mobile (Android)";
    else if (/iphone|ipad|ipod/i.test(ua)) os = "Mobile (iOS)";
    return os;
  }

  function getTodayStr() {
    return new Date().toISOString().split('T')[0];
  }

  // 비고란 클릭 시 창 자동 닫힘 즉시 중지 (창 유지)
  function pauseAutoClose() {
    if (autoCloseTimer) clearTimeout(autoCloseTimer);
    if (countdownInterval) clearInterval(countdownInterval);
    document.getElementById("noticeModal").style.display = "none";
  }

  // 창 3초 후 닫기 실행 함수
  function startAutoClose(htmlMsg, seconds) {
    pauseAutoClose(); // 기존 타이머 초기화

    const modal = document.getElementById("noticeModal");
    const toastTitle = document.getElementById("toastTitle");
    const countEl = document.getElementById("countdown");
    
    toastTitle.innerHTML = htmlMsg;
    let sec = seconds;
    countEl.innerText = sec;
    modal.style.display = "flex";

    countdownInterval = setInterval(() => {
      sec--;
      if (sec > 0) {
        countEl.innerText = sec;
      } else {
        clearInterval(countdownInterval);
      }
    }, 1000);

    autoCloseTimer = setTimeout(() => {
      window.close(); // 브라우저 창 닫기
      modal.style.display = "none";
    }, seconds * 1000);
  }

  // 페이지 접속 시 시각 기반 자동 출/퇴근 처리
  async function initAutoAttendance() {
    const savedName = localStorage.getItem("lastUserName");
    if (savedName) document.getElementById("userName").value = savedName;

    const userName = document.getElementById("userName").value.trim();
    if (!userName) return;

    const todayStr = getTodayStr();
    const savedStatus = localStorage.getItem(`attendance_${userName}_${todayStr}`);
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const timeInMinutes = hours * 60 + minutes;

    const btnIn = document.getElementById("btnCheckIn");
    
    // 1. 이미 출근/퇴근 완료 상태인 경우: 3초 후 창 닫기
    if (savedStatus === "checkedIn" || savedStatus === "completed") {
      btnIn.disabled = true;
      btnIn.innerText = "☀️ 출근 완료됨";

      // 오후 5시 20분(17:20 = 1040분) 이후 접속 시 자동 퇴근 처리
      if (timeInMinutes >= 1040 && savedStatus !== "completed") {
        await sendAttendance('checkOut', true);
      } else {
        startAutoClose("<span style='color:#007bff;'>ℹ️ 이미 출근 처리된 상태입니다.</span>", 3);
      }
      return;
    }

    // 2. 오전 7시(07:00 = 420분) 이후 접속 시 아직 출근 전이면 자동 출근 처리
    if (timeInMinutes >= 420 && !savedStatus) {
      await sendAttendance('checkIn', true);
    }
  }

  document.getElementById("userName").addEventListener("input", function() {
    localStorage.setItem("lastUserName", this.value.trim());
  });

  window.addEventListener("DOMContentLoaded", () => {
    initAutoAttendance();
  });

  // 출퇴근 등록
  async function sendAttendance(actionType, isAuto = false) {
    const userName = document.getElementById("userName").value.trim();
    const notes = document.getElementById("notes").value.trim();
    const btnIn = document.getElementById("btnCheckIn");
    const btnOut = document.getElementById("btnCheckOut");

    if (!userName) {
      alert("성함을 입력해 주세요.");
      return;
    }

    btnIn.disabled = true;
    btnOut.disabled = true;

    const payload = {
      action: actionType,
      userName: userName,
      notes: notes,
      ip: userIp,
      device: getDeviceInfo()
    };

    try {
      const res = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const resultText = await res.text();

      if (resultText.includes("Success")) {
        const todayStr = getTodayStr();
        if (actionType === 'checkIn') {
          localStorage.setItem(`attendance_${userName}_${todayStr}`, "checkedIn");
          btnIn.innerText = "☀️ 출근 완료됨";
          startAutoClose("<span style='color:#28a745;'>☀️ 출근 기록이 정상 등록되었습니다!</span>", 3);
        } else {
          localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");
          btnOut.disabled = false;
          startAutoClose("<span style='color:#dc3545;'>🌙 퇴근 기록이 정상 등록되었습니다!</span>", 3);
        }
        document.getElementById("notes").value = "";
      } else {
        alert("등록 중 오류가 발생했습니다: " + resultText);
        btnOut.disabled = false;
      }
    } catch (err) {
      alert("서버 통신 오류가 발생했습니다.");
      btnOut.disabled = false;
    }
  }

  // 모달 제어
  function openOutstationModal() {
    pauseAutoClose();
    const currentName = document.getElementById("userName").value.trim();
    if (currentName) document.getElementById("reqName").value = currentName;
    document.getElementById("outstationModal").style.display = "flex";
  }

  function closeOutstationModal() {
    document.getElementById("outstationModal").style.display = "none";
  }

  // 사외근무 사전 신청 제출
  async function submitOutstationRequest() {
    const name = document.getElementById("reqName").value.trim();
    const email = document.getElementById("reqEmail").value.trim();
    const date = document.getElementById("reqDate").value;
    const reason = document.getElementById("reqReason").value.trim();
    const submitBtn = document.getElementById("btnSubmitOutstation");

    if (!name || !date || !reason) {
      alert("성함, 외근 예정 일자, 사유를 모두 입력해 주세요.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "신청 중...";

    const payload = {
      action: "outstationRequest",
      userName: name,
      userEmail: email,
      workDate: date,
      reason: reason
    };

    try {
      await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      closeOutstationModal();
      document.getElementById("reqReason").value = "";
      submitBtn.disabled = false;
      submitBtn.innerText = "신청 제출";

      startAutoClose("<span style='color:#007bff;'>📝 사외근무 신청이 완료되었습니다.<br><small style='font-size:13px; font-weight:normal; color:#555;'>관리자 승인 결과가 이메일로 발송됩니다.</small></span>", 3);

    } catch (err) {
      alert("신청 중 오류가 발생했습니다.");
      submitBtn.disabled = false;
      submitBtn.innerText = "신청 제출";
    }
  }
</script>

</body>
</html>
