<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 출퇴근 관리</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #ffffff; padding: 32px 28px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; text-align: center; }
    .title { font-size: 24px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .time-display { font-size: 14px; color: #666; margin-bottom: 12px; }
    .status-msg { font-size: 13px; font-weight: 600; min-height: 20px; margin-bottom: 12px; }
    .alert-box { padding: 12px; border-radius: 10px; font-weight: 600; font-size: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .alert-box.success { background-color: #d1e7dd; color: #0f5132; }
    .alert-box.info { background-color: #cff4fc; color: #055160; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { font-size: 14px; font-weight: 700; color: #222; display: block; margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #e1e4e8; border-radius: 10px; font-size: 15px; outline: none; transition: border 0.2s; }
    input[type="text"]:focus { border-color: #007bff; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .btn-in { background-color: #007bff; color: white; }
    .btn-out { background-color: #6c757d; color: white; }
    button:disabled { background-color: #a0a5aa !important; color: #ffffff !important; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">🏢 사내 출퇴근 관리</div>
    <div class="time-display" id="clock">계산 중...</div>
    <div class="status-msg" id="closeNotice"></div>
    <div class="alert-box info" id="statusBox">성함을 입력한 후 출퇴근 버튼을 눌러주세요.</div>

    <div class="form-group">
      <label for="userName">이름</label>
      <input type="text" id="userName" placeholder="성함을 입력하세요 (예: 홍길동)" autocomplete="off" onfocus="pauseAutoClose()" oninput="pauseAutoClose()">
    </div>

    <div class="form-group">
      <label for="notes">비고 (외근, 특이사항 기재)</label>
      <input type="text" id="notes" placeholder="예: 외근 후 복귀, 최종 퇴근 등 입력" onfocus="pauseAutoClose()" oninput="pauseAutoClose()">
    </div>

    <div class="btn-group">
      <button class="btn-in" id="btnCheckIn" onclick="manualCheck('checkIn')">출근하기</button>
      <button class="btn-out" id="btnCheckOut" onclick="manualCheck('checkOut')">퇴근하기</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyEcFtbdS1M8vX8NVVV35WIX6p5hnX9tMrk-_o8T-dXD60SSOlWtdOv5rUDOS7DyOk5/exec";

    let userIp = "-";
    let closeTimer = null;
    let isWriting = false;

    // IP 수집
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => userIp = data.ip)
      .catch(() => userIp = "IP 확인 불가");

    function initApp() {
      updateClock();
      setInterval(updateClock, 1000);
      
      const savedName = localStorage.getItem("att_saved_name") || "";
      if (savedName) {
        document.getElementById("userName").value = savedName;
        checkDailyStatus(savedName);
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleString("ko-KR");
    }

    function pauseAutoClose() {
      isWriting = true;
      if (closeTimer) clearInterval(closeTimer);
      const notice = document.getElementById("closeNotice");
      notice.style.color = "#0056b3";
      notice.innerText = "✏️ 작성 중: 자동 닫힘이 정지되었습니다.";
    }

    // 📌 오늘 상태 확인 및 버튼 상태 제어 (복귀 후 재퇴근 가능하도록 보완)
    function checkDailyStatus(name) {
      const today = new Date().toISOString().split('T')[0];
      const inKey = `att_in_${name}_${today}`;
      const outKey = `att_out_${name}_${today}`;

      const hasCheckedIn = localStorage.getItem(inKey);
      const hasCheckedOut = localStorage.getItem(outKey);

      const btnIn = document.getElementById("btnCheckIn");
      const btnOut = document.getElementById("btnCheckOut");
      const statusBox = document.getElementById("statusBox");

      // 오늘 출근을 완료했다면 출근 버튼 비활성화
      if (hasCheckedIn) {
        btnIn.innerText = "출근 완료됨";
        btnIn.disabled = true;

        // 📌 출근이 완료된 상태라면 이미 퇴근했더라도 [퇴근하기] 버튼은 언제든 재신청이 가능하도록 항상 활성화!
        btnOut.innerText = hasCheckedOut ? "퇴근 재기록" : "퇴근하기";
        btnOut.disabled = false;
      }

      if (hasCheckedIn && hasCheckedOut) {
        statusBox.className = "alert-box info";
        statusBox.innerText = `ℹ️ ${name}님 퇴근 기록 완료됨 (복귀 시 재퇴근 가능)`;
        if (!isWriting) {
          startCountdown(3);
        }
      } else if (hasCheckedIn && !hasCheckedOut) {
        statusBox.className = "alert-box info";
        statusBox.innerText = `ℹ️ ${name}님 오늘 출근 기록 완료됨`;
        if (!isWriting) {
          startCountdown(3);
        }
      }
    }

    function startCountdown(seconds) {
      if (isWriting) return;

      let left = seconds;
      const notice = document.getElementById("closeNotice");
      notice.style.color = "#007bff";
      notice.innerText = `${left}초 후 창이 닫힙니다...`;

      if (closeTimer) clearInterval(closeTimer);

      closeTimer = setInterval(() => {
        if (isWriting) {
          clearInterval(closeTimer);
          return;
        }
        left--;
        if (left > 0) {
          notice.innerText = `${left}초 후 창이 닫힙니다...`;
        } else {
          clearInterval(closeTimer);
          window.close();
          setTimeout(() => {
            notice.innerText = "기록 완료! 이 창을 닫으셔도 됩니다.";
          }, 500);
        }
      }, 1000);
    }

    function manualCheck(action) {
      const name = document.getElementById("userName").value.trim();
      if (!name) {
        alert("성함을 입력해 주세요.");
        return;
      }

      localStorage.setItem("att_saved_name", name);

      const statusBox = document.getElementById("statusBox");
      const btnIn = document.getElementById("btnCheckIn");
      const btnOut = document.getElementById("btnCheckOut");

      btnIn.disabled = true;
      btnOut.disabled = true;

      const actionText = (action === 'checkIn') ? '출근' : '퇴근';
      statusBox.className = "alert-box success";
      statusBox.innerText = `✅ ${name}님 ${actionText} 처리 중...`;

      const notes = document.getElementById('notes').value.trim();
      const payload = {
        action: action,
        name: name,
        userName: name,
        note: notes,
        notes: notes,
        ip: userIp,
        device: navigator.userAgent.includes('Mobile') ? '모바일' : 'PC Chrome'
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      }).then(() => {
        finishAndClose(name, action, actionText);
      }).catch(err => {
        console.error("전송 오류:", err);
        finishAndClose(name, action, actionText);
      });
    }

    function finishAndClose(name, action, actionText) {
      const today = new Date().toISOString().split('T')[0];
      const key = (action === 'checkIn') ? `att_in_${name}_${today}` : `att_out_${name}_${today}`;
      
      localStorage.setItem(key, new Date().toLocaleTimeString("ko-KR"));

      const notice = document.getElementById("closeNotice");
      const statusBox = document.getElementById("statusBox");

      statusBox.innerText = `✅ ${actionText} 기록 완료!`;
      notice.style.color = "#007bff";
      notice.innerText = "1초 후 창이 닫힙니다...";

      setTimeout(() => {
        window.close();
        setTimeout(() => {
          notice.innerText = "기록이 완료되었습니다. 창을 닫으셔도 됩니다.";
        }, 500);
      }, 1000);
    }

    // 📌 PC 종료 감지 시 자동 퇴근 처리 (17:00 이후일 때만 작동)
    window.addEventListener("pagehide", function() {
      const name = document.getElementById("userName").value.trim();
      if (!name) return;

      const now = new Date();
      const hours = now.getHours();
      const today = new Date().toISOString().split('T')[0];
      const inKey = `att_in_${name}_${today}`;
      const outKey = `att_out_${name}_${today}`;

      if (localStorage.getItem(inKey) && !localStorage.getItem(outKey) && hours >= 17) {
        localStorage.setItem(outKey, now.toLocaleTimeString("ko-KR"));

        const payload = {
          action: 'checkOut',
          name: name,
          userName: name,
          note: 'PC 종료 자동 퇴근',
          notes: 'PC 종료 자동 퇴근',
          ip: userIp,
          device: 'PC Chrome'
        };

        navigator.sendBeacon(GAS_URL, JSON.stringify(payload));
      }
    });

    window.onload = initApp;
  </script>
</body>
</html>
