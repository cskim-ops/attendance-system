<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 통합 출퇴근 및 근태 관리 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 10px auto 30px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
      color: #495057;
    }
    input[type="text"], input[type="email"], textarea, input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea { resize: vertical; }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn-in { background-color: #28a745; }
    .btn-in:hover { background-color: #218838; }
    .btn-in:disabled { background-color: #6c757d; cursor: not-allowed; opacity: 0.6; }
    .btn-out { background-color: #dc3545; }
    .btn-out:hover { background-color: #c82333; }
    .btn-outstation {
      width: 100%;
      background-color: #6c757d;
      margin-top: 12px;
    }
    .btn-outstation:hover { background-color: #5a6268; }

    #topBanner {
      display: none;
      max-width: 500px;
      margin: 0 auto 10px auto;
      padding: 12px;
      background-color: #e8f4fe;
      border: 1px solid #b6d4fe;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #0c5460;
    }
    .pause-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      background: #dc3545;
      color: white;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-modal-cancel { background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-modal-submit { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div id="topBanner">
  <span id="bannerText">☀️ 출근 처리 중입니다...</span> 
  <b>(<span id="countdown">3</span>초 후 창 닫힘)</b>
  <span class="pause-badge" onclick="pauseAutoClose()">창 유지하기 ⏸️</span>
</div>

<div class="container">
  <h2>🏢 출퇴근 기록 관리</h2>

  <div class="form-group">
    <label for="userName">성함</label>
    <input type="text" id="userName" placeholder="성함을 입력하세요 (예: 홍길동)" onfocus="pauseAutoClose()">
  </div>

  <div class="form-group">
    <label for="notes">비고 (특이사항)</label>
    <textarea id="notes" rows="2" placeholder="사유 작성 시 자동 닫힘이 일시 중지됩니다." onclick="pauseAutoClose()" onfocus="pauseAutoClose()" oninput="pauseAutoClose()"></textarea>
  </div>

  <div class="btn-group">
    <button id="btnCheckIn" class="btn btn-in" onclick="sendAttendance('checkIn')">☀️ 출근 등록</button>
    <button id="btnCheckOut" class="btn btn-out" onclick="sendAttendance('checkOut')">🌙 퇴근 등록 (재등록 가능)</button>
  </div>

  <button class="btn btn-outstation" onclick="pauseAutoClose(); openOutstationModal();">📝 사외근무 (현장출퇴근 / 외근 / 직퇴) 신청</button>
</div>

<!-- 팝업 모달창 -->
<div id="outstationModal" class="modal-overlay">
  <div class="modal-content" style="text-align: left;">
    <h3 style="margin-top:0; color:#2c3e50;">📝 사외근무 (현장출퇴근/외근) 신청</h3>
    <div class="form-group">
      <label for="reqName">성함</label>
      <input type="text" id="reqName" placeholder="성함 입력">
    </div>
    <div class="form-group">
      <label for="reqEmail">승인 결과 수신 이메일</label>
      <input type="email" id="reqEmail" placeholder="결과를 통보받을 이메일 주소">
    </div>
    <div class="form-group">
      <label for="reqDate">사외근무 예정 일자</label>
      <input type="date" id="reqDate">
    </div>
    <div class="form-group">
      <label for="reqReason">사유 및 현장 장소</label>
      <textarea id="reqReason" rows="3" placeholder="예: 오전 OO현장 직접 출근 / 외부 미팅 후 현지 퇴근"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeOutstationModal()">취소</button>
      <button id="btnSubmitOutstation" class="btn-modal-submit" onclick="submitOutstationRequest()">승인 요청 제출</button>
    </div>
  </div>
</div>

<script>
  // ⚠️ 본인의 실제 배포된 앱스 스크립트 웹앱 URL
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx8WMOshxIsDfgPCm_QXU6SweH2ukWGwL0OWFRMll8FN2SCD2IKaMaosMT7naDE5e5M/exec";

  let userIp = "-";
  let autoCloseTimer = null;
  let countdownInterval = null;
  let isPaused = false;

  // 🌐 1. IP 주소 수집 (타임아웃 2초 포함으로 전송 직전 동기 실행)
  async function fetchIp() {
    try {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), 2000);
      const res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
      clearTimeout(id);
      const data = await res.json();
      userIp = data.ip || "IP 수집 불가";
    } catch (e) {
      userIp = "IP 수집 불가";
    }
    return userIp;
  }

  // 📱 2. 디바이스 환경 조회
  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let os = "Desktop";
    if (/windows/i.test(ua)) os = "Desktop (Windows)";
    else if (/macintosh|mac os x/i.test(ua)) os = "Desktop (Mac)";
    else if (/android/i.test(ua)) os = "Mobile (Android)";
    else if (/iphone|ipad|ipod/i.test(ua)) os = "Mobile (iOS)";
    return os;
  }

  function getTodayStr() {
    const d = new Date();
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  // ⏸️ 3. 자동 닫힘 타이머 일시 정지
  function pauseAutoClose() {
    isPaused = true;
    if (autoCloseTimer) clearTimeout(autoCloseTimer);
    if (countdownInterval) clearInterval(countdownInterval);
    
    const banner = document.getElementById("topBanner");
    if (banner) {
      banner.style.backgroundColor = "#fff3cd";
      banner.style.borderColor = "#ffebaa";
      banner.innerHTML = "<b>⏸️ 자동 닫힘이 일시 정지되었습니다. (작성 완료 후 직접 닫으셔도 됩니다)</b>";
    }
  }

  // ⏱️ 4. 3초 카운트다운 후 창 닫힘
  function startAutoClose(msgText, seconds) {
    if (isPaused) return;

    if (autoCloseTimer) clearTimeout(autoCloseTimer);
    if (countdownInterval) clearInterval(countdownInterval);

    const banner = document.getElementById("topBanner");
    const bannerText = document.getElementById("bannerText");
    const countEl = document.getElementById("countdown");
    
    if (banner && bannerText && countEl) {
      bannerText.innerText = msgText;
      let sec = seconds;
      countEl.innerText = sec;
      banner.style.display = "block";

      countdownInterval = setInterval(() => {
        sec--;
        if (sec > 0) {
          countEl.innerText = sec;
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000);
    }

    autoCloseTimer = setTimeout(() => {
      if (!isPaused) {
        window.close();
        setTimeout(() => {
          window.open('', '_self', '');
          window.close();
        }, 100);
      }
    }, seconds * 1000);
  }

  // 🔄 5. 자동 출근 실행 함수 (기존 출근 이력 확인)
  async function initAutoAttendance() {
    const nameInput = document.getElementById("userName");
    const savedName = localStorage.getItem("lastUserName");

    if (savedName) {
      nameInput.value = savedName;
    } else {
      return;
    }

    const userName = savedName.trim();
    const todayStr = getTodayStr();
    const savedStatus = localStorage.getItem(`attendance_${userName}_${todayStr}`);
    const btnIn = document.getElementById("btnCheckIn");

    if (savedStatus === "checkedIn" || savedStatus === "completed") {
      btnIn.disabled = true;
      btnIn.innerText = "☀️ 출근 완료됨";
      startAutoClose("☀️ 이미 당일 출근 기록이 존재합니다.", 3);
      return;
    }

    await sendAttendance('checkIn', true);
  }

// 🚀 6. 출근 / 퇴근 전송 함수 (퇴근 시 3초 자동 닫힘 제외 처리)
  async function sendAttendance(actionType, isAuto = false) {
    const userName = document.getElementById("userName").value.trim();
    const notes = document.getElementById("notes").value.trim();
    const btnIn = document.getElementById("btnCheckIn");
    const btnOut = document.getElementById("btnCheckOut");

    if (!userName) {
      alert("성함을 입력해 주세요.");
      return;
    }

    localStorage.setItem("lastUserName", userName);
    btnIn.disabled = true;

    // 💡 전송 직전 IP 조회를 확실하게 기다려서 수집
    if (userIp === "-" || userIp === "IP 수집 불가") {
      await fetchIp();
    }

    const payload = {
      action: actionType,
      userName: userName,
      notes: notes,
      ip: userIp,
      device: getDeviceInfo()
    };

    try {
      await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      
      const todayStr = getTodayStr();
      if (actionType === 'checkIn') {
        localStorage.setItem(`attendance_${userName}_${todayStr}`, "checkedIn");
        btnIn.innerText = "☀️ 출근 완료됨";
        startAutoClose("☀️ 출근 기록이 정상 등록되었습니다!", 3); // 출근 시에만 3초 후 자동 닫힘 유지
      } else {
        localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");
        btnOut.disabled = false;
        
        // 🌙 퇴근 시: 3초 자동 닫힘 타이머를 실행하지 않고 배너만 안내로 변경
        pauseAutoClose(); // 혹시 진행 중인 카운트다운이 있다면 멈춤
        const banner = document.getElementById("topBanner");
        if (banner) {
          banner.style.backgroundColor = "#e8f4fe";
          banner.style.borderColor = "#b6d4fe";
          banner.style.display = "block";
          banner.innerHTML = "<b>🌙 퇴근 등록이 완료되었습니다. (업무 종료 후 창을 닫아주시면 됩니다)</b>";
        }
      }
      document.getElementById("notes").value = "";

    } catch (err) {
      alert("서버 통신 오류가 발생했습니다. 다시 시도해 주세요.");
      btnIn.disabled = false;
    }
  }

 // 🌙 창을 닫거나 이동할 때 백그라운드 퇴근 신호 전송
window.addEventListener("beforeunload", function (e) {
  const userName = localStorage.getItem("lastUserName") || document.getElementById("userName").value.trim();
  const todayStr = getTodayStr();

  // 이미 오늘 퇴근 처리가 완료된 경우 전송하지 않음
  if (!userName || localStorage.getItem(`attendance_${userName}_${todayStr}`) === "completed") {
    return;
  }

  // 17시 이후 창을 닫을 때 자동 퇴근 처리
  const currentHour = new Date().getHours();
  if (currentHour >= 17) {
    const payload = JSON.stringify({
      action: "autoCheckOut",        // 👈 백엔드에 창닫힘 자동퇴근 신호 전송
      userName: userName,
      notes: "자동감지(창닫힘)",       // 👈 E열(비고)로 들어갈 텍스트만 전달
      ip: userIp,
      device: getDeviceInfo()
    });

    navigator.sendBeacon(GAS_WEBAPP_URL, payload);
    localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");
  }
});

  // 📝 8. 사외근무 모달 관련
  function openOutstationModal() {
    pauseAutoClose();
    const currentName = document.getElementById("userName").value.trim();
    if (currentName) document.getElementById("reqName").value = currentName;
    document.getElementById("outstationModal").style.display = "flex";
  }

  function closeOutstationModal() {
    document.getElementById("outstationModal").style.display = "none";
  }

  async function submitOutstationRequest() {
    const name = document.getElementById("reqName").value.trim();
    const email = document.getElementById("reqEmail").value.trim();
    const date = document.getElementById("reqDate").value;
    const reason = document.getElementById("reqReason").value.trim();
    const submitBtn = document.getElementById("btnSubmitOutstation");

    if (!name || !email || !date || !reason) {
      alert("성함, 수신 이메일, 사외근무 일자, 사유를 모두 입력해 주세요.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "승인 요청 중...";

    const payload = {
      action: "requestLeaveApproval",
      userName: name,
      userEmail: email,
      startDate: date,
      endDate: date,
      leaveType: "사외근무(현장출퇴근/외근)",
      notes: reason
    };

    try {
      await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      closeOutstationModal();
      document.getElementById("reqReason").value = "";
      submitBtn.disabled = false;
      submitBtn.innerText = "승인 요청 제출";

      alert("사외근무(현장출퇴근) 승인 요청이 관리자에게 전달되었습니다.");
      startAutoClose("📝 사외근무 신청이 완료되었습니다.", 3);

    } catch (err) {
      alert("신청 중 오류가 발생했습니다.");
      submitBtn.disabled = false;
      submitBtn.innerText = "승인 요청 제출";
    }
  }

  // 🎬 9. 이벤트 리스너 세팅
  document.getElementById("userName").addEventListener("input", function() {
    const name = this.value.trim();
    if (name) localStorage.setItem("lastUserName", name);
  });

  window.addEventListener("DOMContentLoaded", async () => {
    document.getElementById("reqDate").value = getTodayStr();
    await fetchIp(); // 웹페이지 오픈 시 IP부터 확실하게 로딩
    initAutoAttendance();
  });
</script>

</body>
</html>
