<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 통합 출퇴근 및 근태 관리 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 30px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
      color: #495057;
    }
    input[type="text"], textarea, input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }
    textarea { resize: vertical; }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: background-color 0.2s;
    }
    .btn-in { background-color: #28a745; }
    .btn-in:hover { background-color: #218838; }
    .btn-out { background-color: #dc3545; }
    .btn-out:hover { background-color: #c82333; }
    .btn-outstation {
      width: 100%;
      background-color: #6c757d;
      margin-top: 12px;
    }
    .btn-outstation:hover { background-color: #5a6268; }
    .cert-link-box {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      text-align: center;
    }
    .btn-cert {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background-color: #2c3e50;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .btn-cert:hover { background-color: #1a252f; }

    /* Modal Style */
    .modal-overlay {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-modal-cancel { background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-modal-submit { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>🏢 출퇴근 기록 관리</h2>

  <div class="form-group">
    <label for="userName">성함</label>
    <input type="text" id="userName" placeholder="성함을 입력하세요 (예: 홍길동)">
  </div>

  <div class="form-group">
    <label for="notes">비고 (특이사항)</label>
    <textarea id="notes" rows="2" placeholder="사유가 있는 경우 기재 (예: 유연근무, 시외출 등)"></textarea>
  </div>

  <div class="btn-group">
    <button class="btn btn-in" onclick="sendAttendance('checkIn')">☀️ 출근 등록</button>
    <button class="btn btn-out" onclick="sendAttendance('checkOut')">🌙 퇴근 등록</button>
  </div>

  <button class="btn btn-outstation" onclick="openOutstationModal()">📝 사외근무 / 직퇴 사전 신청</button>

  </div>

<!-- 사외근무 사전 신청 모달 팝업 -->
<div id="outstationModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#2c3e50;">사외근무(직퇴) 사전 신청</h3>
    <div class="form-group">
      <label for="reqName">성함</label>
      <input type="text" id="reqName" placeholder="성함 입력">
    </div>
    <div class="form-group">
      <label for="reqDate">외근 예정 일자</label>
      <input type="date" id="reqDate">
    </div>
    <div class="form-group">
      <label for="reqReason">사유 및 미팅 장소</label>
      <textarea id="reqReason" rows="3" placeholder="예: OO기업 외부 미팅 후 현지 퇴근"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeOutstationModal()">취소</button>
      <button class="btn-modal-submit" onclick="submitOutstationRequest()">신청 제출</button>
    </div>
  </div>
</div>

<script>
  // ⚠️ 배포하신 구글 앱스 스크립트(GAS) 웹앱 URL을 입력해 주세요.
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzb90zCJvs9ea5dP8k0a4dYX5Cys_f1OcP-PKUfri4Cw9vG1RLHvPO12nhNqDlwIc0K/exec";

  // IP 및 기기 정보 수집
  let userIp = "-";
  async function fetchIp() {
    try {
      const res = await fetch("https://api.ipify.org?format=json");
      const data = await res.json();
      userIp = data.ip || "-";
    } catch (e) {
      userIp = "IP 수집 불가";
    }
  }
  fetchIp();

  function getDeviceInfo() {
    const ua = navigator.userAgent;
    if (/mobile/i.test(ua)) return "Mobile (" + (navigator.platform || "Unknown") + ")";
    return "Desktop (" + (navigator.platform || "Unknown") + ")";
  }

  // 출퇴근 등록 (Append-Only)
  async function sendAttendance(actionType) {
    const userName = document.getElementById("userName").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!userName) {
      alert("성함을 입력해 주세요.");
      return;
    }

    const payload = {
      action: actionType,
      userName: userName,
      notes: notes,
      ip: userIp,
      device: getDeviceInfo()
    };

    try {
      const res = await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const resultText = await res.text();

      if (resultText.includes("Success")) {
        alert(`${actionType === 'checkIn' ? '출근' : '퇴근'} 기록이 정상 등록되었습니다.`);
        document.getElementById("notes").value = "";
      } else {
        alert("등록 중 오류가 발생했습니다: " + resultText);
      }
    } catch (err) {
      alert("서버 통신 오류가 발생했습니다. 구글 앱스 스크립트 URL을 확인해 주세요.");
    }
  }

  // 모달 제어
  function openOutstationModal() {
    const currentName = document.getElementById("userName").value.trim();
    if (currentName) document.getElementById("reqName").value = currentName;
    document.getElementById("outstationModal").style.display = "flex";
  }
  function closeOutstationModal() {
    document.getElementById("outstationModal").style.display = "none";
  }

  // 사외근무 신청 제출
  async function submitOutstationRequest() {
    const name = document.getElementById("reqName").value.trim();
    const date = document.getElementById("reqDate").value;
    const reason = document.getElementById("reqReason").value.trim();

    if (!name || !date || !reason) {
      alert("모든 항목을 입력해 주세요.");
      return;
    }

    const payload = {
      action: "outstationRequest",
      userName: name,
      workDate: date,
      reason: reason
    };

    try {
      await fetch(GAS_WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      alert("사외근무 사전 신청이 완료되었습니다.\n관리자 승인 시 출퇴근 데이터에 자동 반영됩니다.");
      closeOutstationModal();
      document.getElementById("reqReason").value = "";
    } catch (err) {
      alert("신청 중 오류가 발생했습니다.");
    }
  }
</script>

</body>
</html>
