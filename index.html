<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 출퇴근 관리 시스템</title>
  <style>
    body {
      font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 22px;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #475569;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-in {
      background-color: #16a34a;
      color: #ffffff;
    }
    .btn-in:hover:not(:disabled) {
      background-color: #15803d;
    }
    .btn-out {
      background-color: #dc2626;
      color: #ffffff;
    }
    .btn-out:hover:not(:disabled) {
      background-color: #b91c1c;
    }
    .info-text {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏢 사내 출퇴근 등록</h2>
    
    <div class="form-group">
      <label for="userName">성함</label>
      <input type="text" id="userName" placeholder="이름을 입력하세요 (예: 홍길동)" autocomplete="off">
    </div>

    <div class="btn-group">
      <button id="btnCheckIn" class="btn-in">출근하기</button>
      <button id="btnCheckOut" class="btn-out">퇴근하기</button>
    </div>

    <p class="info-text">
      ※ 17시 20분 이후 퇴근 처리 시 출퇴근 관리 시트 창이 자동으로 열립니다.<br>
      ※ 입력하신 정보와 접속 IP/디바이스 정보가 함께 기록됩니다.
    </p>
  </div>

  <script>
    // 🔗 구글 앱스 스크립트 웹앱 URL (본인 URL로 확인 및 유지)
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxSA-PHHCFJPwlm0FobT_gPk1_KRnR9_MyksBEN7EYkaXDcjTonxStVSgx_1TP0yrtb/exec";

    // 📊 모든 직원이 17:20 이후 퇴근 시 이동할 중앙 구글 시트 URL (실제 시트 주소로 교체)
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1UqHcuu4K7R8a_z5H9TOfSznh9BonXaXEHTTUxx4Bk-4/edit#gid=0";

    let userIp = "-";

    // 🌐 접속 IP 추출
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { userIp = data.ip; })
      .catch(() => { userIp = "-"; });

    // 📱 디바이스 정보 추출
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (/mobile/i.test(ua)) return "Mobile Device";
      if (/iPad|Tablet/i.test(ua)) return "Tablet Device";
      if (/Macintosh/i.test(ua)) return "Desktop (Mac)";
      if (/Windows/i.test(ua)) return "Desktop (Windows)";
      return "Desktop (Other)";
    }

    // 📅 오늘 날짜 스트링 (yyyy-MM-dd)
    function getTodayStr() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 💡 17시 20분 이후인지 판단하여 구글 시트 새 탭 열기
    function openSheetIfAfter1720() {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();

      // 17시 20분 이상이거나 18시 이후일 때
      const isAfter1720 = (currentHour === 17 && currentMinute >= 20) || (currentHour > 17);

      if (isAfter1720) {
        window.open(GOOGLE_SHEET_URL, "_blank");
      }
    }

    // 🟢 [1] 출근 버튼 클릭 이벤트
    document.getElementById("btnCheckIn").addEventListener("click", async function () {
      const userNameInput = document.getElementById("userName");
      const userName = userNameInput.value.trim();
      const btnIn = this;

      if (!userName) {
        alert("성함을 입력해 주세요.");
        userNameInput.focus();
        return;
      }

      if (btnIn.disabled) return;
      btnIn.disabled = true;

      // 이름 로컬 저장
      localStorage.setItem("lastUserName", userName);

      const payload = {
        action: "checkIn",
        userName: userName,
        notes: "-",
        ip: userIp,
        device: getDeviceInfo()
      };

      try {
        const response = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert(`${userName} 님, 출근 처리가 완료되었습니다.`);
        } else {
          alert("출근 처리 중 오류가 발생했습니다.");
        }
      } catch (err) {
        alert("통신 오류가 발생했습니다: " + err.message);
      } finally {
        btnIn.disabled = false;
      }
    });

    // 🔴 [2] 퇴근 버튼 클릭 이벤트 (3초 자동 닫힘 삭제 완료)
    document.getElementById("btnCheckOut").addEventListener("click", async function () {
      const userNameInput = document.getElementById("userName");
      const userName = userNameInput.value.trim();
      const btnOut = this;

      if (!userName) {
        alert("성함을 입력해 주세요.");
        userNameInput.focus();
        return;
      }

      if (btnOut.disabled) return;
      btnOut.disabled = true;

      localStorage.setItem("lastUserName", userName);

      const payload = {
        action: "checkOut",
        userName: userName,
        notes: "-", // 클릭 퇴근은 메모 기본값 "-"
        ip: userIp,
        device: getDeviceInfo()
      };

      try {
        const response = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert(`${userName} 님, 퇴근 처리가 완료되었습니다.`);
          
          const todayStr = getTodayStr();
          localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");

          // 17:20 이후인 경우 구글 시트 새 탭 자동 열기
          openSheetIfAfter1720();

          // ❌ 3초 후 window.close() 자동 닫힘 로직 완벽 제거됨
        } else {
          alert("퇴근 처리 중 오류가 발생했습니다.");
          btnOut.disabled = false;
        }
      } catch (err) {
        alert("통신 오류가 발생했습니다: " + err.message);
        btnOut.disabled = false;
      }
    });

    // 🌙 [3] 17시 이후 창을 닫을 때 백그라운드 자동 퇴근 전송
    window.addEventListener("beforeunload", function (e) {
      const userNameInput = document.getElementById("userName");
      const userName = (userNameInput ? userNameInput.value.trim() : "") || localStorage.getItem("lastUserName") || "";
      const todayStr = getTodayStr();

      if (!userName || localStorage.getItem(`attendance_${userName}_${todayStr}`) === "completed") {
        return;
      }

      const currentHour = new Date().getHours();
      if (currentHour >= 17) {
        const payload = JSON.stringify({
          action: "autoCheckOut",
          userName: userName,
          notes: "자동감지(창닫힘)",
          ip: userIp,
          device: getDeviceInfo()
        });

        navigator.sendBeacon(GAS_WEBAPP_URL, payload);
        localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");
      }
    });

    // 페이지 로드 시 기존 이름 자동 입력
    window.addEventListener("DOMContentLoaded", () => {
      const savedName = localStorage.getItem("lastUserName");
      if (savedName) {
        document.getElementById("userName").value = savedName;
      }
    });
  </script>
</body>
</html>
