<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 출퇴근 관리</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #ffffff; padding: 32px 28px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 420px; text-align: center; }
    .title { font-size: 24px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .time-display { font-size: 14px; color: #666; margin-bottom: 12px; }
    .status-msg { font-size: 13px; font-weight: 600; min-height: 20px; margin-bottom: 12px; }
    .alert-box { padding: 12px; border-radius: 10px; font-weight: 600; font-size: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .alert-box.success { background-color: #d1e7dd; color: #0f5132; }
    .alert-box.info { background-color: #cff4fc; color: #055160; }
    .form-group { text-align: left; margin-bottom: 18px; }
    label { font-size: 14px; font-weight: 700; color: #222; display: block; margin-bottom: 8px; }
    select, input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid #e1e4e8; border-radius: 10px; font-size: 15px; outline: none; transition: border 0.2s; }
    select:focus, input[type="text"]:focus { border-color: #007bff; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 14px; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .btn-in { background-color: #007bff; color: white; }
    .btn-out { background-color: #6c757d; color: white; }
    button:disabled { background-color: #a0a5aa !important; color: #ffffff !important; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">🏢 사내 출퇴근 관리</div>
    <div class="time-display" id="clock">2026. 11. 3. 오전 00:00:00</div>
    <div class="status-msg" id="closeNotice"></div>
    <div class="alert-box success" id="statusBox">✅ 출퇴근 정보를 확인하는 중...</div>

    <div class="form-group">
      <label for="userName">사원 선택</label>
      <select id="userName" onchange="onUserSelect()">
        <option value="신나래">신나래</option>
        <option value="박경선">박경선</option>
        <option value="최희원">최희원</option>
        <option value="신홍지">신홍지</option>
        <option value="배미희">배미희</option>
        <option value="김청식">김청식</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notes">비고 (외근, 특이사항 기재)</label>
      <input type="text" id="notes" placeholder="예: 외근, 지각 사유, 조퇴 등 입력" onfocus="pauseAutoClose()" oninput="pauseAutoClose()">
    </div>

    <div class="btn-group">
      <button class="btn-in" id="btnCheckIn" onclick="manualCheck('출근')">출근하기</button>
      <button class="btn-out" id="btnCheckOut" onclick="manualCheck('퇴근')">퇴근하기</button>
    </div>
  </div>

  <script>
    // ⚠️ 본인의 Google Apps Script 배포 URL로 교체하세요.
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2ahqmEFNj9brB1yUiEYhqlW0ICo-M9HvAur3YS48ko1gpulH9N1mYcQB-iZ7MuBQ8/exec";

    let closeTimer = null;
    let autoClosePaused = false;

    // 시계 및 자동 로직 초기화
    function initApp() {
      updateClock();
      setInterval(updateClock, 1000);
      checkUserStatus();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").innerText = now.toLocaleString("ko-KR");
    }

    // 마우스 대거나 비고란 작성 시 창 닫힘 일시 정지
    function pauseAutoClose() {
      if (!autoClosePaused) {
        autoClosePaused = true;
        if (closeTimer) clearInterval(closeTimer);
        document.getElementById("closeNotice").style.color = "#0056b3";
        document.getElementById("closeNotice").innerText = "✏️ 작성 중: 자동 닫힘이 정지되었습니다.";
      }
    }

    // 사용자 선택/상태 체크
    function checkUserStatus() {
      const name = document.getElementById("userName").value;
      const today = new Date().toISOString().split('T')[0];
      
      const inKey = `att_in_${name}_${today}`;
      const outKey = `att_out_${name}_${today}`;

      const hasCheckedIn = localStorage.getItem(inKey);
      const hasCheckedOut = localStorage.getItem(outKey);

      const btnIn = document.getElementById("btnCheckIn");
      const btnOut = document.getElementById("btnCheckOut");
      const statusBox = document.getElementById("statusBox");

      // 출근 버튼 상태 제어
      if (hasCheckedIn) {
        btnIn.innerText = "출근 완료됨";
        btnIn.disabled = true;
      } else {
        btnIn.innerText = "출근하기";
        btnIn.disabled = false;
      }

      // 퇴근 버튼 상태 제어
      if (hasCheckedOut) {
        btnOut.innerText = "퇴근 완료됨";
        btnOut.disabled = true;
      } else {
        btnOut.innerText = "퇴근하기";
        btnOut.disabled = false;
      }

      // 시간 기준 자동 출/퇴근 체크 (PC 부팅/종료 시)
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const timeVal = hours * 100 + minutes;

      // 1. 오전 7:00 이후 출근 미완료 시 자동 출근
      if (timeVal >= 700 && timeVal < 1720 && !hasCheckedIn) {
        statusBox.className = "alert-box success";
        statusBox.innerText = `✅ ${name}님 자동 출근 완료!`;
        sendAttendance(name, "출근", 3);
      } 
      // 2. 오후 5:20 (17:20) 이후 퇴근 미완료 시 자동 퇴근
      else if (timeVal >= 1720 && !hasCheckedOut) {
        statusBox.className = "alert-box info";
        statusBox.innerText = `🌙 ${name}님 자동 퇴근 완료!`;
        sendAttendance(name, "퇴근", 5);
      } 
      // 이미 체크된 상태
      else if (hasCheckedIn && !hasCheckedOut) {
        statusBox.className = "alert-box info";
        statusBox.innerText = `ℹ️ ${name}님 오늘 출근 기록 완료됨`;
        startCountdown(3);
      } else if (hasCheckedOut) {
        statusBox.className = "alert-box info";
        statusBox.innerText = `ℹ️ ${name}님 오늘 출퇴근 기록 완료됨`;
        startCountdown(5);
      }
    }

    function onUserSelect() {
      if (closeTimer) clearInterval(closeTimer);
      autoClosePaused = false;
      document.getElementById("closeNotice").innerText = "";
      checkUserStatus();
    }

    // 수동 출퇴근 버튼 클릭
    function manualCheck(type) {
      const name = document.getElementById("userName").value;
      const sec = (type === "출근") ? 3 : 5;
      sendAttendance(name, type, sec);
    }

    // Google Apps Script로 전송
    function sendAttendance(name, type, countdownSec) {
      const today = new Date().toISOString().split('T')[0];
      const key = (type === "출근") ? `att_in_${name}_${today}` : `att_out_${name}_${today}`;
      
      // 중복 방지 저장
      localStorage.setItem(key, new Date().toLocaleTimeString("ko-KR"));

      const notes = document.getElementById("notes").value;
      const payload = {
        userName: name,
        type: type,
        notes: notes,
        device: "PC Chrome"
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        checkUserStatus();
        startCountdown(countdownSec);
      }).catch(err => console.error("전송 오류:", err));
    }

    // 카운트다운 및 자동 창 닫기
    function startCountdown(seconds) {
      if (autoClosePaused) return;
      
      let left = seconds;
      const notice = document.getElementById("closeNotice");
      notice.style.color = "#007bff";
      notice.innerText = `${left}초 후 창을 닫는 중...`;

      if (closeTimer) clearInterval(closeTimer);

      closeTimer = setInterval(() => {
        if (autoClosePaused) {
          clearInterval(closeTimer);
          return;
        }
        left--;
        if (left > 0) {
          notice.innerText = `${left}초 후 창을 닫는 중...`;
        } else {
          clearInterval(closeTimer);
          window.close();
        }
      }, 1000);
    }

    window.onload = initApp;
  </script>
</body>
</html>
