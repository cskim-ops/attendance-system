<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 출퇴근 등록</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 440px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
    }
    
    /* 📢 출근 성공 후 상단 알림 배너 */
    #topBanner {
      display: none;
      padding: 12px;
      background-color: #e8f4fe;
      border: 1px solid #b6d4fe;
      border-radius: 10px;
      text-align: center;
      font-size: 13.5px;
      color: #0c5460;
      margin-bottom: 20px;
    }
    .pause-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 6px;
      background: #dc2626;
      color: white;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: bold; color: #475569; margin-bottom: 8px; }
    input[type="text"], input[type="email"], input[type="date"], textarea {
      width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none;
    }

    .btn-group { display: flex; gap: 12px; margin-top: 10px; }
    button {
      flex: 1; padding: 16px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: #ffffff;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; background-color: #64748b !important; }
    .btn-in { background-color: #16a34a; }
    .btn-out { background-color: #dc2626; }
    .btn-outstation { width: 100%; background-color: #475569; margin-top: 12px; padding: 12px; font-size: 14px; }

    .info-text { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 24px; line-height: 1.6; }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 420px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .btn-modal-cancel { background: #94a3b8; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
    .btn-modal-submit { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <!-- 📢 상단 카운트다운 배너 -->
    <div id="topBanner">
      <span id="bannerText">☀️ 출근 처리 중입니다...</span> 
      <b>(<span id="countdown">3</span>초 후 창 닫힘)</b>
      <span class="pause-badge" onclick="pauseAutoClose()">창 유지하기 ⏸️</span>
    </div>

    <h2>🏢 사내 출퇴근 등록</h2>
    
    <div class="form-group">
      <label for="userName">성함</label>
      <input type="text" id="userName" placeholder="성함을 입력하세요 (예: 홍길동)" autocomplete="off" onfocus="pauseAutoClose()">
    </div>

    <div class="form-group">
      <label for="notes">비고 (특이사항)</label>
      <input type="text" id="notes" placeholder="특이사항 입력 시 기록에 포함됩니다." autocomplete="off" onfocus="pauseAutoClose()">
    </div>

    <div class="btn-group">
      <button id="btnCheckIn" class="btn-in">출근하기</button>
      <button id="btnCheckOut" class="btn-out">퇴근하기</button>
    </div>

    <button type="button" class="btn-outstation" onclick="pauseAutoClose(); openOutstationModal();">📝 사외근무 / 직퇴 사전 신청</button>

    <p class="info-text">
      ※ 17시 20분 이후 이 창을 닫으면 퇴근 처리가 자동 기록됩니다.<br>
      ※ 입력하신 정보와 접속 IP/디바이스 정보가 함께 기록됩니다.
    </p>
  </div>

  <!-- 사외근무 신청 모달 -->
  <div id="outstationModal" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#1e293b; font-size:18px;">📝 사외근무(직퇴) 사전 신청</h3>
      <div class="form-group">
        <label for="reqName">성함</label>
        <input type="text" id="reqName" placeholder="성함 입력">
      </div>
      <div class="form-group">
        <label for="reqEmail">결과 수신 이메일</label>
        <input type="email" id="reqEmail" placeholder="결과를 안내받을 이메일 주소">
      </div>
      <div class="form-group">
        <label for="reqDate">외근 예정 일자</label>
        <input type="date" id="reqDate">
      </div>
      <div class="form-group">
        <label for="reqReason">사유 및 미팅 장소</label>
        <textarea id="reqReason" rows="3" placeholder="예: OO기업 외부 미팅 후 현지 퇴근"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-modal-cancel" onclick="closeOutstationModal()">취소</button>
        <button type="button" id="btnSubmitOutstation" class="btn-modal-submit" onclick="submitOutstationRequest()">신청 제출</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyx7Tvj7OxRcVwqMsBmUV9MabeLc-1YdvKmH0UJt4O2xlDrOXc9xUIt93BvL0FGqKyE/exec";

    let userIp = "-";
    let autoCloseTimer = null;
    let countdownInterval = null;
    let isPaused = false;

    // 🌐 IP 주소 추적
    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => { userIp = data.ip || "-"; })
      .catch(() => { userIp = "-"; });

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (/mobile/i.test(ua)) return "Mobile Device";
      if (/iPad|Tablet/i.test(ua)) return "Tablet Device";
      if (/Macintosh/i.test(ua)) return "Desktop (Mac)";
      if (/Windows/i.test(ua)) return "Desktop (Windows)";
      return "Desktop (Other)";
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // ⏱️ 3초 후 자동 닫기 타이머 제어
    function pauseAutoClose() {
      isPaused = true;
      if (autoCloseTimer) clearTimeout(autoCloseTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      
      const banner = document.getElementById("topBanner");
      if (banner) {
        banner.style.backgroundColor = "#fff3cd";
        banner.style.borderColor = "#ffebaa";
        banner.innerHTML = "<b>⏸️ 창 자동 닫힘이 일시 정지되었습니다.</b>";
      }
    }

    function startAutoClose(msgText, seconds) {
      if (isPaused) return;

      if (autoCloseTimer) clearTimeout(autoCloseTimer);
      if (countdownInterval) clearInterval(countdownInterval);

      const banner = document.getElementById("topBanner");
      const bannerText = document.getElementById("bannerText");
      const countEl = document.getElementById("countdown");
      
      if (banner && bannerText && countEl) {
        bannerText.innerText = msgText;
        let sec = seconds;
        countEl.innerText = sec;
        banner.style.display = "block";

        countdownInterval = setInterval(() => {
          sec--;
          if (sec > 0) {
            countEl.innerText = sec;
          } else {
            clearInterval(countdownInterval);
          }
        }, 1000);
      }

      autoCloseTimer = setTimeout(() => {
        if (!isPaused) {
          window.close();
          setTimeout(() => {
            window.open('', '_self', '');
            window.close();
          }, 100);
        }
      }, seconds * 1000);
    }

    // 💡 당일 출근 상태 검사 및 버튼 비활성화
    function checkAttendanceState() {
      const userName = document.getElementById("userName").value.trim();
      const btnIn = document.getElementById("btnCheckIn");
      const todayStr = getTodayStr();

      if (!userName) return;

      const status = localStorage.getItem(`attendance_${userName}_${todayStr}`);
      if (status === "checkedIn" || status === "completed") {
        btnIn.disabled = true;
        btnIn.innerText = "☀️ 출근 완료됨";
      }
    }

    // 🟢 [1] 출근 처리 (3초 후 창 자동 닫힘)
    document.getElementById("btnCheckIn").addEventListener("click", async function () {
      const userNameInput = document.getElementById("userName");
      const userName = userNameInput.value.trim();
      const notes = document.getElementById("notes").value.trim();
      const btnIn = this;

      if (!userName) { alert("성함을 입력해 주세요."); return; }
      if (btnIn.disabled) return;
      btnIn.disabled = true;

      localStorage.setItem("lastUserName", userName);

      const payload = { action: "checkIn", userName: userName, notes: notes || "-", ip: userIp, device: getDeviceInfo() };

      try {
        const response = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const todayStr = getTodayStr();
          localStorage.setItem(`attendance_${userName}_${todayStr}`, "checkedIn");
          checkAttendanceState();
          
          // 💡 출근 완료 시 3초 후 창 자동 닫기 실행
          startAutoClose("☀️ 출근 처리가 완료되었습니다!", 3);
        } else {
          alert("출근 처리 오류가 발생했습니다.");
          btnIn.disabled = false;
        }
      } catch (err) {
        alert("통신 오류 발생: " + err.message);
        btnIn.disabled = false;
      }
    });

    // 🔴 [2] 수동 퇴근 처리
    document.getElementById("btnCheckOut").addEventListener("click", async function () {
      const userNameInput = document.getElementById("userName");
      const userName = userNameInput.value.trim();
      const notes = document.getElementById("notes").value.trim();
      const btnOut = this;

      if (!userName) { alert("성함을 입력해 주세요."); return; }
      if (btnOut.disabled) return;
      btnOut.disabled = true;

      localStorage.setItem("lastUserName", userName);

      const payload = { action: "checkOut", userName: userName, notes: notes || "-", ip: userIp, device: getDeviceInfo() };

      try {
        const response = await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const todayStr = getTodayStr();
          localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");
          startAutoClose("🌙 퇴근 처리가 완료되었습니다!", 3);
        }
      } catch (err) {
        alert("통신 오류 발생: " + err.message);
      } finally {
        btnOut.disabled = false;
      }
    });

   // 🌙 [3] 17시 20분 이후 창을 닫을 때 백그라운드 자동 퇴근 전송 (빈행 및 중복 전송 방지)
    let isAutoSent = false; // 중복 전송 방지 플래그

    function triggerAutoCheckOut() {
      if (isAutoSent) return; // 이미 이벤트 중 하나가 실행되었다면 즉시 차단

      // input 태그에서 성함을 가져오되, 파기되었을 경우 localStorage 값을 우선 사용
      const savedName = localStorage.getItem("lastUserName") || "";
      const userNameInput = document.getElementById("userName");
      const userName = (userNameInput && userNameInput.value.trim()) ? userNameInput.value.trim() : savedName;
      
      const todayStr = getTodayStr();

      // 성함 정보가 아예 없는 경우 빈행 생성 방지를 위해 절대 전송하지 않음
      if (!userName || userName === "") return;

      const now = new Date();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();
      const isAfter1720 = (currentHour === 17 && currentMinute >= 20) || (currentHour > 17);

      if (isAfter1720) {
        isAutoSent = true; // 전송 시작 시 플래그 차단

        const payload = JSON.stringify({
          action: "autoCheckOut",
          userName: userName,
          notes: "PC 자동 종료 퇴근",
          ip: userIp,
          device: getDeviceInfo()
        });

        if (navigator.sendBeacon) {
          const blob = new Blob([payload], { type: 'text/plain;charset=utf-8' });
          navigator.sendBeacon(GAS_WEBAPP_URL, blob);
        } else {
          fetch(GAS_WEBAPP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: payload,
            keepalive: true
          }).catch(() => {});
        }

        localStorage.setItem(`attendance_${userName}_${todayStr}`, "completed");
      }
    }

    // Windows/Mac 브라우저 닫힘 감지 (3가지 이벤트 중 먼저 발동하는 1개만 실행됨)
    window.addEventListener("beforeunload", triggerAutoCheckOut);
    window.addEventListener("pagehide", triggerAutoCheckOut);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") triggerAutoCheckOut();
    });

    // 사외근무 모달
    function openOutstationModal() {
      const currentName = document.getElementById("userName").value.trim();
      if (currentName) document.getElementById("reqName").value = currentName;
      document.getElementById("outstationModal").style.display = "flex";
    }

    function closeOutstationModal() {
      document.getElementById("outstationModal").style.display = "none";
    }

    async function submitOutstationRequest() {
      const name = document.getElementById("reqName").value.trim();
      const email = document.getElementById("reqEmail").value.trim();
      const date = document.getElementById("reqDate").value;
      const reason = document.getElementById("reqReason").value.trim();
      const submitBtn = document.getElementById("btnSubmitOutstation");

      if (!name || !date || !reason) { alert("필수 항목을 모두 입력해 주세요."); return; }

      submitBtn.disabled = true;
      submitBtn.innerText = "신청 중...";

      const payload = { action: "outstationRequest", userName: name, userEmail: email, leaveType: "사외근무(현장출퇴근/외근)", startDate: date, endDate: date, notes: reason };

      try {
        await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        alert("📝 사외근무 사전 신청이 완료되었습니다.");
        closeOutstationModal();
      } catch (err) {
        alert("신청 중 오류가 발생했습니다.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "신청 제출";
      }
    }

    document.getElementById("userName").addEventListener("input", checkAttendanceState);

    window.addEventListener("DOMContentLoaded", () => {
      const savedName = localStorage.getItem("lastUserName");
      if (savedName) document.getElementById("userName").value = savedName;
      checkAttendanceState();
    });
  </script>
</body>
</html>
